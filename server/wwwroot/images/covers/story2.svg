<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <radialGradient id="pearlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <radialGradient id="lightShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#oceanGrad)" />
  <!-- Water Light Rays -->
  <polygon points="50,0 90,0 160,300 100,300" fill="#ffffff" opacity="0.08" />
  <polygon points="180,0 230,0 300,300 240,300" fill="#ffffff" opacity="0.06" />
  <polygon points="310,0 350,0 390,300 350,300" fill="#ffffff" opacity="0.08" />
  <!-- Bubbles -->
  <circle cx="70" cy="180" r="6" fill="#ffffff" opacity="0.3" />
  <circle cx="90" cy="120" r="10" fill="#ffffff" opacity="0.25" />
  <circle cx="310" cy="90" r="8" fill="#ffffff" opacity="0.3" />
  <circle cx="330" cy="160" r="5" fill="#ffffff" opacity="0.2" />
  <!-- Sea Floor -->
  <path d="M 0,260 Q 100,240 200,255 T 400,250 L 400,300 L 0,300 Z" fill="#032b43" />
  <!-- Corals -->
  <path d="M 30,260 Q 40,200 60,210 Q 50,170 80,190 Q 90,260 90,260" fill="#f43f5e" opacity="0.8" />
  <path d="M 330,250 Q 320,180 340,190 Q 355,160 375,185 Q 365,250 365,250" fill="#f97316" opacity="0.85" />
  <!-- Clam Shell -->
  <g transform="translate(200, 210)">
    <!-- Back Shell -->
    <path d="M -70,20 C -70,-30 -30,-60 0,-60 C 30,-60 70,-30 70,20 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <line x1="0" y1="20" x2="-40" y2="-45" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="0" y1="20" x2="0" y2="-58" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="0" y1="20" x2="40" y2="-45" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Pearl Glow -->
    <circle cx="0" cy="-10" r="42" fill="url(#lightShine)" />
    <circle cx="0" cy="-10" r="26" fill="url(#pearlGlow)" stroke="#ffffff" stroke-width="2" />
    <circle cx="-8" cy="-18" r="7" fill="#ffffff" opacity="0.75" />
    <!-- Front Shell Lip -->
    <ellipse cx="0" cy="20" rx="72" ry="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  </g>
  <!-- Dolphin Silhouette -->
  <path d="M 240,65 C 270,50 300,55 315,75 C 310,80 295,80 280,78 C 285,88 280,95 272,90 C 265,85 260,82 250,85 C 235,90 230,80 240,65 Z" fill="#e0f2fe" opacity="0.75" />
  <!-- Title Badge -->
  <rect x="120" y="245" width="160" height="34" rx="17" fill="rgba(12, 74, 110, 0.85)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="200" y="267" text-anchor="middle" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold">سر اللؤلؤة الزرقاء</text>
</svg>
