<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="sunbeams" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#forestGrad)" />
  <circle cx="200" cy="80" r="140" fill="url(#sunbeams)" />
  <!-- Ancient Tree Foliage -->
  <circle cx="200" cy="90" r="70" fill="#22c55e" opacity="0.9" />
  <circle cx="140" cy="110" r="55" fill="#16a34a" opacity="0.95" />
  <circle cx="260" cy="110" r="55" fill="#15803d" opacity="0.95" />
  <circle cx="200" cy="65" r="50" fill="#4ade80" opacity="0.85" />
  <!-- Tree Trunk -->
  <path d="M 175,140 L 170,240 Q 140,260 110,265 L 290,265 Q 260,260 230,240 L 225,140 Z" fill="url(#trunkGrad)" />
  <!-- Tree hollow with glow -->
  <ellipse cx="200" cy="185" rx="14" ry="22" fill="#451a03" />
  <!-- Treasure Map / Scroll -->
  <g transform="translate(100, 190) rotate(-10)">
    <rect x="0" y="0" width="60" height="42" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <path d="M 8,10 Q 25,25 45,15 Q 52,30 35,32" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
    <text x="35" y="36" fill="#b45309" font-size="14" font-weight="bold">✕</text>
  </g>
  <!-- Treasure Chest -->
  <g transform="translate(250, 205)">
    <rect x="0" y="10" width="46" height="28" rx="4" fill="#854d0e" stroke="#ca8a04" stroke-width="1.5" />
    <path d="M 0,10 Q 23,-4 46,10 Z" fill="#a16207" stroke="#ca8a04" stroke-width="1.5" />
    <circle cx="23" cy="18" r="4" fill="#fef08a" />
    <!-- Sparkles -->
    <polygon points="10,-6 13,-2 17,-3 14,1 16,5 11,3 8,6 9,1 5,-1 9,-3" fill="#fef08a" />
    <polygon points="40,2 42,5 45,4 43,7 44,10 41,8 39,11 40,7 37,6 40,4" fill="#fef08a" />
  </g>
  <!-- Grass Hill -->
  <path d="M 0,250 Q 200,230 400,250 L 400,300 L 0,300 Z" fill="#14532d" />
  <!-- Arabic Badge -->
  <rect x="110" y="245" width="180" height="34" rx="17" fill="rgba(20, 83, 45, 0.9)" stroke="#4ade80" stroke-width="1.5" />
  <text x="200" y="267" text-anchor="middle" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold">خريطة الشجرة العتيقة</text>
</svg>
