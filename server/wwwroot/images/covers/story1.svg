<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#skyGrad1)" />
  <circle cx="200" cy="120" r="100" fill="url(#glow1)" />
  <!-- Stars -->
  <circle cx="45" cy="40" r="2.5" fill="#fef08a" />
  <circle cx="120" cy="70" r="1.5" fill="#ffffff" />
  <circle cx="340" cy="50" r="3" fill="#fef08a" />
  <circle cx="280" cy="90" r="2" fill="#ffffff" />
  <circle cx="80" cy="180" r="2" fill="#ffffff" />
  <circle cx="330" cy="210" r="2.5" fill="#fde047" />
  <circle cx="70" cy="95" r="1.5" fill="#ffffff" />
  <!-- Planet -->
  <circle cx="90" cy="220" r="45" fill="#f59e0b" opacity="0.85" />
  <ellipse cx="90" cy="220" rx="65" ry="12" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.7" transform="rotate(-20 90 220)" />
  <!-- Space Probe / Satellite -->
  <g transform="translate(200, 130)">
    <!-- Solar Panels -->
    <rect x="-85" y="-12" width="45" height="24" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <line x1="-62" y1="-12" x2="-62" y2="12" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="-85" y1="0" x2="-40" y2="0" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="40" y="-12" width="45" height="24" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <line x1="62" y1="-12" x2="62" y2="12" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="40" y1="0" x2="85" y2="0" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Connector Bars -->
    <line x1="-40" y1="0" x2="-25" y2="0" stroke="#94a3b8" stroke-width="4" />
    <line x1="40" y1="0" x2="25" y2="0" stroke="#94a3b8" stroke-width="4" />
    <!-- Main Body -->
    <rect x="-25" y="-28" width="50" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="0" cy="0" r="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" />
    <polygon points="-8,-28 0,-48 8,-28" fill="#ef4444" />
    <!-- Antenna -->
    <line x1="0" y1="-48" x2="0" y2="-62" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="0" cy="-64" r="3" fill="#ef4444" />
    <!-- Thruster -->
    <polygon points="-12,28 12,28 8,42 -8,42" fill="#64748b" />
    <polygon points="-6,42 6,42 0,55" fill="#38bdf8" opacity="0.8" />
  </g>
  <!-- Arabic Badge -->
  <rect x="120" y="245" width="160" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="200" y="267" text-anchor="middle" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold">باسم ومسبار الأمل</text>
</svg>
