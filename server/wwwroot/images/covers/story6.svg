  <ellipse cx="200" cy="177" rx="35" ry="4" fill="#451a03" />
  <!-- Arabic Badge -->
  <rect x="110" y="245" width="180" height="34" rx="17" fill="rgba(126, 34, 206, 0.88)" stroke="#f5d0fe" stroke-width="1.5" />
  <text x="200" y="267" text-anchor="middle" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold">بذرة الحكمة العجيبة</text>
