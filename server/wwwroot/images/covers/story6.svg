      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="50%" stop-color="#fae8ff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>
    <linearGradient id="potGrad6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <radialGradient id="flowerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#warmBg6)" />
  <!-- Sparkles of Wisdom in Background -->
  <polygon points="120,50 123,56 130,57 124,62 126,69 120,65 114,69 116,62 110,57 117,56" fill="#a855f7" opacity="0.6" />
  <polygon points="280,60 282,64 287,65 283,69 284,74 280,71 276,74 277,69 273,65 278,64" fill="#ec4899" opacity="0.6" />
  <polygon points="90,120 92,124 97,125 93,129 94,134 90,131 86,134 87,129 83,125 88,124" fill="#fbbf24" opacity="0.7" />
  <polygon points="310,130 312,134 317,135 313,139 314,144 310,141 306,144 307,139 303,135 308,134" fill="#fbbf24" opacity="0.7" />
