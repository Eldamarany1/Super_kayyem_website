  <!-- Petals -->
  <ellipse cx="200" cy="72" rx="12" ry="18" fill="#c084fc" opacity="0.9" />
  <ellipse cx="200" cy="108" rx="12" ry="18" fill="#c084fc" opacity="0.9" />
  <ellipse cx="182" cy="90" rx="18" ry="12" fill="#d8b4fe" opacity="0.9" />
  <ellipse cx="218" cy="90" rx="18" ry="12" fill="#d8b4fe" opacity="0.9" />
  <ellipse cx="187" cy="77" rx="14" ry="14" fill="#e879f9" opacity="0.95" />
  <ellipse cx="213" cy="77" rx="14" ry="14" fill="#e879f9" opacity="0.95" />
  <ellipse cx="187" cy="103" rx="14" ry="14" fill="#e879f9" opacity="0.95" />
  <ellipse cx="213" cy="103" rx="14" ry="14" fill="#e879f9" opacity="0.95" />
  <!-- Flower Center -->
  <circle cx="200" cy="90" r="13" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" />
