<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <radialGradient id="starGlow5" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#nightSky5)" />
  <!-- Stars -->
  <circle cx="50" cy="50" r="2.5" fill="#fef08a" />
  <circle cx="110" cy="30" r="1.5" fill="#ffffff" />
  <circle cx="160" cy="70" r="2" fill="#ffffff" />
  <circle cx="250" cy="40" r="2.5" fill="#fef08a" />
  <circle cx="340" cy="65" r="2" fill="#ffffff" />
  <circle cx="380" cy="30" r="3" fill="#fef08a" />
  <!-- Star Bridge Glow -->
  <path d="M 60,180 Q 200,90 340,180" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.6" stroke-linecap="round" />
  <path d="M 60,180 Q 200,90 340,180" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" stroke-linecap="round" />
  <!-- Bridge Stars -->
  <circle cx="100" cy="150" r="4" fill="#fef08a" />
  <circle cx="150" cy="125" r="5" fill="#ffffff" />
  <circle cx="200" cy="115" r="6" fill="#fef08a" />
  <circle cx="250" cy="125" r="5" fill="#ffffff" />
  <circle cx="300" cy="150" r="4" fill="#fef08a" />
  <!-- Crescent Moon -->
  <path d="M 330,35 A 25,25 0 0 0 350,75 A 20,20 0 0 1 330,35 Z" fill="#fde047" />
  <!-- Cozy Snowy Hills -->
  <path d="M -20,230 Q 100,190 220,220 T 420,200 L 420,300 L -20,300 Z" fill="#e0e7ff" />
  <path d="M -20,255 Q 160,230 420,260 L 420,300 L -20,300 Z" fill="#c7d2fe" />
  <!-- Little Rabbit & Squirrel silhouettes -->
  <g transform="translate(160, 195)">
    <!-- Rabbit -->
    <ellipse cx="10" cy="15" rx="10" ry="14" fill="#ffffff" />
    <circle cx="10" cy="3" r="7" fill="#ffffff" />
    <ellipse cx="7" cy="-8" rx="2.5" ry="7" fill="#ffffff" />
    <ellipse cx="13" cy="-8" rx="2.5" ry="7" fill="#ffffff" />
    <circle cx="19" cy="18" r="3" fill="#ffffff" />
  </g>
  <g transform="translate(210, 195)">
    <!-- Squirrel -->
    <ellipse cx="15" cy="15" rx="9" ry="13" fill="#d97706" />
    <circle cx="12" cy="5" r="6" fill="#d97706" />
    <path d="M 23,20 Q 32,8 28,-2 Q 22,0 20,10 Z" fill="#d97706" />
  </g>
  <!-- Arabic Badge -->
  <rect x="110" y="245" width="180" height="34" rx="17" fill="rgba(49, 46, 129, 0.9)" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="200" y="267" text-anchor="middle" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold">جسر النجوم الدافئ</text>
</svg>
